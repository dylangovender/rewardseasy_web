# Tiered earn rates per programme — for the per-account analysis after the Venn.
# Researched 3 Oct 2026. Percentages are "up to" rates at each tier/level.

ebucks:
  # Rows indexed by reward level L1..L5. Pay with the FNB Virtual Card. Accounts: Premier, Private Clients (PC),
  # Private Wealth (PW), RMB Private Bank (RMB). L5 needs 9,500 / 11,000 / 13,000 / 13,000 points.
  levels: [L1, L2, L3, L4, L5]
  source: "ebucks.com earn-from-the-bank-2026 pages + 2026/27 Summary Guides"
  rates:
    pick_n_pay_asap:     { all_accounts: [2, 5, 10, 15, 30], unit: pct }
    pick_n_pay_instore:  { all_accounts: [1.5, 3, 6, 10, 20], unit: pct }
    pick_n_pay_clothing: { all_accounts: [1.5, 3, 6, 10, 20], unit: pct }
    clicks:              { all_accounts_l5: 15, unit: pct, note: "30% on Family Day (15th) and Wednesdays 60+" }
    arc:                 { premier_l5: 15, private_wealth: [2, 5, 10, 15, 30], unit: pct }
    golfers_club:        { l5: 30, unit: pct }
    engen_fuel:
      unit: rand_per_litre
      base:      [0.20, 0.40, 0.80, 2, 4]
      plus_vehicle_finance: [0.10, 0.20, 0.40, 1, 2]
      plus_fnb_car_insurance: [0.10, 0.20, 0.40, 1, 2]
      max_l5: 8
      monthly_cap: { premier: 2000, private_clients: 2500, private_wealth: 3000 }
    devices_partner_shop: { L3: 25, L4: 50, l5: { premier: 40, private_clients: 60, private_wealth: 100, rmb: 100 }, unit: pct }
    woolworths:
      unit: rand_reward_at_spend_threshold
      note: "From 1 Oct 2026. Highest threshold reached in the month; Virtual Card only. Not available to Premier."
      private_clients:
        - { spend: 1000, reward: [10, 15, 20, 40, 60] }
        - { spend: 2500, reward: [30, 40, 55, 110, 175] }
        - { spend: 4000, reward: [90, 110, 165, 350, 600] }
      private_wealth_and_rmb:
        - { spend: 1500, reward: [20, 30, 40, 80, 120] }
        - { spend: 2500, reward: [60, 80, 110, 220, 350] }
        - { spend: 6500, reward: [180, 220, 330, 700, 1000] }
  grocery_cap_premier: 3000

ucount:
  # Rows indexed by Tier 1..5 (Tiering Points: 0-399 / 400-574 / 575-724 / 725-874 / 875+). R25/month membership.
  tiers: [T1, T2, T3, T4, T5]
  source: "ucount.standardbank.co.za earn-points pages"
  caps: "Lower of 20% of total card spend or R2,500 per cycle (CYOR, Clicks, fuel)"
  rates:
    checkers_shoprite_sixty60_online:
      virtual_credit:  [4, 6, 10, 20, 40]
      physical_credit: [4, 6, 8, 15, 30]
      evolve:          [1.5, 2.5, 3.5, 6, 15]
      debit_cheque:    [0.5, 0.75, 1, 2, 5]
    checkers_shoprite_instore:
      virtual_credit:  [4, 6, 8, 15, 30]
      physical_credit: [2, 3, 4, 10, 20]
      evolve:          [1.5, 2.5, 3.5, 6, 15]
      debit_cheque:    [0.5, 0.75, 1, 2, 5]
    other_cyor_retailers:   # Woolworths, Makro, Game, fashion & lifestyle retailers in your chosen category
      credit:          [2, 3, 4, 10, 20]
      evolve:          [1.5, 2.5, 3.5, 6, 15]
      debit_cheque:    [0.5, 0.75, 1, 2, 5]
      note: "Non-chosen CYOR categories earn up to 1%"
    clicks:
      virtual_credit_online:  [4, 6, 8, 15, 30]
      virtual_credit_instore: [2, 3, 4, 10, 20]
      physical_credit:        [1.5, 2.5, 3.5, 7.5, 15]
      virtual_evolve_online:  [1.35, 2.25, 3.25, 6.5, 12.5]
      virtual_evolve_instore: [1.25, 2, 3, 5, 10]
      physical_evolve:        [1, 1.5, 2, 3.5, 7.5]
      virtual_debit_online:   [0.5, 1, 1.5, 3, 6.5]
      virtual_debit_instore:  [0.35, 0.5, 0.75, 1.5, 5]
    astron_energy_fuel:
      unit: rand_per_litre
      credit:   [0.30, 0.45, 0.90, 1.50, 5.00]
      evolve:   [0.15, 0.30, 0.50, 1.00, 2.50]
      debit:    [0.10, 0.15, 0.30, 0.50, 1.00]
      double_credit: [0.60, 0.90, 1.80, 3.00, 10.00]
      double_evolve: [0.30, 0.60, 1.00, 2.00, 5.00]
      note: "Double requires 100% of spend on a qualifying Standard Bank credit/Evolve card"
