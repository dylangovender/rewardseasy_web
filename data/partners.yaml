# Brand ↔ rewards-programme associations (South Africa) — source for the Venn diagram.
# Researched 3 October 2026 from the official eBucks, UCount and Discovery sites.
#
# roles per programme:
#   earn  = you earn points/eBucks/Miles there
#   spend = you can redeem points/eBucks/Miles there
#   perk  = a membership benefit/voucher partner (not a straight earn/spend partner)
# confidence: high = seen on the programme's own site; medium = secondary source or inferred.

programmes:
  ebucks:    { name: "FNB eBucks",            bank: "FNB / RMB Private Bank", currency: "eBucks (eB10 = R1)" }
  ucount:    { name: "Standard Bank UCount",  bank: "Standard Bank",          currency: "Rewards Points (10 = R1)" }
  discovery: { name: "Discovery Miles",       bank: "Discovery Bank / Vitality", currency: "Discovery Miles (Ð10 = R1)" }

categories:
  groceries: Groceries
  fuel: Fuel
  health_beauty: Health & beauty
  fashion: Fashion
  home: Home
  electronics: Electronics & tech
  online_retail: Online retail
  food_drink: Food & drink
  lifestyle: Lifestyle & leisure
  travel_transport: Travel & transport
  services: Services
  auto: Auto
  gifts: Gifts

